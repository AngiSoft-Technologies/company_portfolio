[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter angisoft-web build"
  publish = "frontend/web/dist"
  functions = "frontend/web/netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  VITE_API_BASE_URL = "https://api.angisoft.co.ke"
  VITE_SOCKET_URL = "https://api.angisoft.co.ke"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/uploads/*"
  to = "https://api.angisoft.co.ke/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
