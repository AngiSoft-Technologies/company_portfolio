<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AngiSoft Technologies — software products and services for African businesses. Web, mobile, ERP, IoT and AI solutions built in Nairobi."
    />
    <title>AngiSoft Technologies</title>
    <script>
      (function () {
        try {
          // No stored choice → follow the device/OS theme; the in-app toggle
          // persists an explicit override to localStorage.
          var stored = localStorage.getItem('angisoft-theme-mode');
          var mode = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.classList.toggle('dark', mode === 'dark');
          document.documentElement.style.colorScheme = mode;

          // Locale: explicit choice wins, otherwise follow the browser. Set
          // lang/dir before paint so RTL layouts do not flash LTR.
          var supported = ['en', 'sw', 'fr', 'es', 'zh', 'ar'];
          var rtl = ['ar'];
          var lang = localStorage.getItem('angisoft-language');
          if (!lang) {
            var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
            lang = String(nav).toLowerCase().split(/[-_]/)[0];
          }
          if (supported.indexOf(lang) === -1) lang = 'en';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', rtl.indexOf(lang) !== -1 ? 'rtl' : 'ltr');
        } catch (_) {}
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
