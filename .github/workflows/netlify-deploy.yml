name: Netlify Deploy

on:
    push:
        branches: [main]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        env:
            VITE_API_BASE_URL: https://api.angisoft.co.ke
            VITE_SOCKET_URL: https://api.angisoft.co.ke
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Enable pnpm
              run: corepack enable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm --filter angisoft-web build

            - name: Build admin
              run: pnpm --filter angisoft-admin build

            - name: Deploy web
              uses: netlify/actions/cli@master
              with:
                  args: deploy --dir=frontend/web/dist --prod --site=${{ secrets.NETLIFY_SITE_ID }}
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

            - name: Deploy admin
              uses: netlify/actions/cli@master
              with:
                  args: deploy --dir=frontend/admin/dist --prod --site=${{ secrets.NETLIFY_ADMIN_SITE_ID }}
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
