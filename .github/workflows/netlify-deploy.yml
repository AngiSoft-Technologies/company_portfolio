name: Netlify Deploy

on:
    push:
        branches: [main]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Blocking secret-scan gate, consistent with lint/typecheck/test/build
            # and the bundle budget below (unlike the non-blocking Lighthouse job
            # in perf-budget.yml). Scans the checked-out tree only; historical
            # git-history hits need a separate manual rotation check (OBS-03 in
            # docs/security/OWASP_AUDIT.md). No GITLEAKS_LICENSE secret is needed.
            - name: Set up Go for gitleaks
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25"

            - name: Install gitleaks
              run: |
                  go install github.com/gitleaks/gitleaks/v8@v8.30.1
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Secret scan (checked-out tree)
              env:
                  GITLEAKS_REPORT_PATH: ${{ runner.temp }}/gitleaks-report.json
              run: bash scripts/scan-secrets.sh

            - name: Upload secret-scan report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: gitleaks-report
                  path: ${{ runner.temp }}/gitleaks-report.json
                  if-no-files-found: ignore

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Enable pnpm
              run: corepack enable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Quality gates — a broken build must never reach production.
            # See docs/ANGISOFT_DIGITAL_HQ_PLAN.md §13 and §14.
            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            # DB-backed specs skip themselves when TEST_DATABASE_URL is unset,
            # so this never touches the production database.
            - name: Test
              run: CI=true pnpm test
              env:
                  TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

            # Neither app sets VITE_API_BASE_URL — both call /api/* same-origin
            # through their Netlify proxy so the SameSite=Strict refresh cookie
            # is actually sent. See docs/NETLIFY.md §Routing.
            - name: Build web
              run: pnpm --filter angisoft-web build
              env:
                  VITE_SOCKET_URL: https://api.angisoft.co.ke

            - name: Build admin
              run: pnpm --filter angisoft-admin build
              env:
                  VITE_CDN_BASE_URL: https://cdn1.angisoft.co.ke/company-portfolio
                  VITE_SOCKET_URL: https://api.angisoft.co.ke

            # Phase 5.5: deterministic, blocking bundle-size gate. Runs after
            # both builds so the vendor/entry budgets cover the shipped files.
            - name: Bundle size budget
              run: pnpm perf:budget

            - name: Deploy web
              uses: netlify/actions/cli@master
              with:
                  args: deploy --dir=frontend/web/dist --prod --site=${{ secrets.NETLIFY_SITE_ID }}
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

            - name: Deploy admin
              uses: netlify/actions/cli@master
              with:
                  args: deploy --dir=frontend/admin/dist --prod --site=${{ secrets.NETLIFY_ADMIN_SITE_ID }}
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
