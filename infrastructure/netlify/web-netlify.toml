[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter angisoft-web build"
  publish = "frontend/web/dist"
  functions = "frontend/web/netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # Intentionally NO VITE_API_BASE_URL: the app calls the API same-origin
  # (angisoft.co.ke/v1/*) via the proxy below, so the SameSite=Strict refresh
  # cookie is actually sent.
  # Netlify UI env vars override this file — keep it unset there too.
  VITE_CDN_BASE_URL = "https://cdn1.angisoft.co.ke/company-portfolio"
  VITE_SOCKET_URL = "https://api.angisoft.co.ke"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/uploads/*"
  to = "https://api.angisoft.co.ke/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "https://api.angisoft.co.ke/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The CSP allows hashed Vite assets via 'self', the inline
# theme/meta scripts, Tailwind/React inline styles, CDN/data/blob images, and
# the Socket.IO connection to api.angisoft.co.ke. Third-party allowances cover
# the Google Fonts, Leaflet (unpkg), map tiles and trusted video embeds.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://cdn1.angisoft.co.ke https://i.ytimg.com https://unpkg.com https://*.basemaps.cartocdn.com; media-src 'self' data: blob: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self' https://api.angisoft.co.ke wss://api.angisoft.co.ke; script-src-attr 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), payment=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=()"
    X-Frame-Options = "DENY"