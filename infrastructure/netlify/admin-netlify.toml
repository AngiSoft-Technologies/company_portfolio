[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter angisoft-admin build"
  publish = "frontend/admin/dist"

[build.environment]
  NODE_VERSION = "24"
  # Intentionally NO VITE_API_BASE_URL: the admin app calls the API
  # same-origin (admin.angisoft.co.ke/api/*) via the proxy below, so the
  # SameSite=Strict refresh cookie is actually sent.
  # Netlify UI env vars override this file — keep it unset there too.
  VITE_CDN_BASE_URL = "https://cdn.angisoft.co.ke"
  VITE_SOCKET_URL = "https://api.angisoft.co.ke"

[[redirects]]
  from = "/uploads/*"
  to = "https://api.angisoft.co.ke/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://api.angisoft.co.ke/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200