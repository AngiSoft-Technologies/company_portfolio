app = "company-portfolio"
primary_region = "lhr"
swap_size_mb = 512

[build]
  dockerfile = "../infrastructure/docker/Dockerfile"

[deploy]
  release_command = "npx prisma db migrate"


[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 5_000
min_machines_running = 0
processes = [ "app" ]

[[vm]]
cpus = 1
memory = "2gb"
memory_mb = 2_048